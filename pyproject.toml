[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-capsules"
version = "0.1.0"
description = "Universal learning extraction for AI coding agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "cixuuz" },
]
keywords = ["ai", "agent", "memory", "learning", "capsules", "reflection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = []

[project.optional-dependencies]
hermes = []  # No extra deps needed for Hermes adapter
llm = ["litellm"]
all = ["litellm"]

[project.scripts]
agent-capsules = "agent_capsules.cli:main"

[project.entry-points."hermes_agent.plugins"]
capsule-learner = "agent_capsules.adapters.hermes"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_capsules"]

[tool.hatch.build.targets.sdist]
include = ["src/agent_capsules", "README.md", "LICENSE"]
